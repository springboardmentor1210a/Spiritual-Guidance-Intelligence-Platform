services:

  postgres:
    image: postgres:16
    container_name: palmistry-postgres-compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palmistry_tarot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: palmistry-backend-compose
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmistry_tarot_db
      API_BASE_URL: http://127.0.0.1:8001
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: palmistry-frontend-compose
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: