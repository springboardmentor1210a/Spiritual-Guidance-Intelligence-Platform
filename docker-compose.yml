services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Override these for production or point them at managed services.
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://lunara:lunara@postgres:5432/lunara}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file or deployment environment}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lunara
      POSTGRES_USER: lunara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lunara}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunara -d lunara"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /backend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
